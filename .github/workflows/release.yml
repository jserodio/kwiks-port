name: Build and release

# Builds the game and the launcher for Linux and Windows and attaches them to
# the GitHub release of the tag that triggered the run.
#
# Triggered by pushing a tag such as v0.2.0, or manually from the Actions tab.
#
# The Windows build cross-compiles with MinGW, exactly like tools/prepare_winlibs.sh
# and `./package.sh windows-local` do on a dev machine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- Linux
  build-linux:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          dnf install -y gcc git curl tar \
                         SDL3-devel SDL3_image-devel libopenmpt-devel \
                         python3 python3-tkinter python3-pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the launcher
        run: |
          python3 -m venv .venv-launcher
          .venv-launcher/bin/pip install --quiet pyinstaller
          PYTHON="$PWD/.venv-launcher/bin/python" ./package.sh launcher

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinGW provides the cross-compiler and the tools used to generate the
      # libopenmpt import library from its DLL.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            unzip
            curl
            tar
            zip
            python
          path-type: inherit
          suppress-deprecation-warnings: msystem-mingw64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-compile the game
        shell: msys2 {0}
        run: ./package.sh windows-local

      - name: Build the launcher
        shell: bash
        run: |
          python -m pip install --quiet pyinstaller
          PYTHON="$(command -v python)" ./package.sh launcher

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------- Release
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p upload
          find artifacts -name 'kwiks-launcher-*.tar.gz' -exec cp {} upload/ \;
          ls -la upload

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "Kwiks ${GITHUB_REF_NAME}" \
            --notes "Modern port of Kwiks (1998).

          Unpack the launcher for your platform, run it, choose the original
          game ZIP and press **Set up and build**.

          The original game files are not included: bring your own copy of
          Kwiks (1998, freeware by DIGITAL Nightmares)." \
            || gh release edit "${GITHUB_REF_NAME}" --draft=false
          gh release upload "${GITHUB_REF_NAME}" upload/* --clobber
